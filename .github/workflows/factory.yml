name: Issue factory

# Reusable workflow. A target repo calls it from a thin caller (see examples/target-caller.yml).
# Stages: intake (no tools) -> build (API key, fresh runner) -> gate (no key, no token, fresh runner)
# -> [build 2 -> gate 2, only after a gate failure] -> publish (clean checkout, push token) -> review.
# Every step that holds the API key runs on a runner that never ran the gate. Patches and logs
# move between jobs as artifacts, and publish re-checks the patch.
# Design and cost notes: README.md

on:
  workflow_call:
    inputs:
      gate_path:
        description: Script in the target repo, relative to its root. It must exit 0 before a PR opens.
        type: string
        default: scripts/factory/gate.sh
      factory_ref:
        description: Tag or commit SHA of this repo whose scripts and prompts run. The caller owns the version, so set it to the same tag as the uses line.
        type: string
        required: true
      intake_budget:
        type: string
        default: "0.25"
      builder_budget:
        description: Dollar cap per builder attempt.
        type: string
        default: "2"
      review_budget:
        type: string
        default: "0.5"
    secrets:
      anthropic_api_key:
        required: true
      factory_pat:
        description: Optional fine-grained token. Lets factory PRs trigger the target's CI.
        required: false

permissions: {}

# One run at a time per target repo keeps spend predictable.
concurrency:
  group: issue-factory-${{ github.repository }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: "2.1.317"

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      proceed: ${{ steps.intake.outputs.proceed }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DustyStudy/issue-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Classify issue
        id: intake
        env:
          FACTORY_DIR: ${{ github.workspace }}/factory
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INTAKE_BUDGET: ${{ inputs.intake_budget }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bash factory/scripts/intake.sh

      # A crash here would otherwise leave the issue silent. Hand it to a person.
      - name: Report when intake crashed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create needs-human --color D93F0B --description "Factory stopped; a person decides" --force
          gh issue comment "$ISSUE_NUMBER" --body "Intake crashed before it could classify this issue. Needs a human."
          gh issue edit "$ISSUE_NUMBER" --remove-label factory || true
          gh issue edit "$ISSUE_NUMBER" --add-label needs-human

  # Attempt 1. Holds the API key. Runs no test code: it writes the change as a patch and stops.
  build:
    needs: intake
    if: needs.intake.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.base }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Record base commit
        id: base
        run: echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DustyStudy/issue-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Implement, attempt 1 (API key, no tests run)
        env:
          FACTORY_DIR: ${{ github.workspace }}/factory
          GATE_PATH: ${{ inputs.gate_path }}
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          BUILDER_BUDGET: ${{ inputs.builder_budget }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bash factory/scripts/build.sh implement 1

      - name: Write patch, attempt 1 (no key)
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
        run: bash factory/scripts/build.sh diff 1

      - name: Upload patch, attempt 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attempt-1
          path: ${{ runner.temp }}/patch/patch.diff
          if-no-files-found: error
          retention-days: 7

  # Gate for attempt 1. No key, no token. Runs the test code the builder wrote, on its own runner.
  gate-1:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: read lets checkout read the private target. The token is not passed to the gate.
    permissions:
      contents: read
    outputs:
      result: ${{ steps.gate.outputs.gate }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout target at the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.base }}
          persist-credentials: false

      - name: Checkout factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DustyStudy/issue-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false

      - name: Download patch, attempt 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attempt-1
          path: ${{ runner.temp }}/attempt-1

      - name: Gate, attempt 1 (no key, no token)
        id: gate
        env:
          GATE_PATH: ${{ inputs.gate_path }}
          PATCH: ${{ runner.temp }}/attempt-1/patch.diff
        run: bash factory/scripts/run-gate.sh 1 "$PATCH"

      - name: Upload gate log, attempt 1
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-log-1
          path: ${{ runner.temp }}/gate-1.log
          if-no-files-found: ignore
          retention-days: 7

  # Attempt 2, after a gate failure. Fresh runner with the first patch applied and the gate log.
  build-2:
    needs: [build, gate-1]
    if: needs.gate-1.outputs.result == 'fail'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout target at the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.base }}
          persist-credentials: false

      - name: Download patch, attempt 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attempt-1
          path: ${{ runner.temp }}/in

      - name: Download gate log, attempt 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-log-1
          path: ${{ runner.temp }}/in

      - name: Apply patch, attempt 1
        env:
          PATCH: ${{ runner.temp }}/in/patch.diff
        run: |
          if [ -s "$PATCH" ]; then git apply "$PATCH"; fi

      - name: Checkout factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DustyStudy/issue-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Implement, attempt 2 (API key, no tests run)
        env:
          FACTORY_DIR: ${{ github.workspace }}/factory
          GATE_PATH: ${{ inputs.gate_path }}
          GATE_LOG: ${{ runner.temp }}/in/gate-1.log
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          BUILDER_BUDGET: ${{ inputs.builder_budget }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bash factory/scripts/build.sh implement 2

      - name: Write patch, attempt 2 (no key)
        env:
          BASE_SHA: ${{ needs.build.outputs.base }}
        run: bash factory/scripts/build.sh diff 2

      - name: Upload patch, attempt 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attempt-2
          path: ${{ runner.temp }}/patch/patch.diff
          if-no-files-found: error
          retention-days: 7

  # Gate for attempt 2. The patch is cumulative against the base, so it applies to a fresh base.
  gate-2:
    needs: [build, build-2]
    if: needs.build-2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: read lets checkout read the private target. The token is not passed to the gate.
    permissions:
      contents: read
    outputs:
      result: ${{ steps.gate.outputs.gate }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout target at the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.base }}
          persist-credentials: false

      - name: Checkout factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DustyStudy/issue-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false

      - name: Download patch, attempt 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attempt-2
          path: ${{ runner.temp }}/attempt-2

      - name: Gate, attempt 2 (no key, no token)
        id: gate
        env:
          GATE_PATH: ${{ inputs.gate_path }}
          PATCH: ${{ runner.temp }}/attempt-2/patch.diff
        run: bash factory/scripts/run-gate.sh 2 "$PATCH"

      - name: Upload gate log, attempt 2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-log-2
          path: ${{ runner.temp }}/gate-2.log
          if-no-files-found: ignore
          retention-days: 7

  # Clean checkout at the base commit. The gate never ran here, so .git and the factory scripts are
  # as the factory left them. The push token is used only in this job, and only on a passing patch.
  publish:
    needs: [build, gate-1, build-2, gate-2]
    if: ${{ always() && (needs.gate-1.outputs.result == 'pass' || needs.gate-2.outputs.result == 'pass') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout target at the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.base }}
          persist-credentials: false

      - name: Checkout factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DustyStudy/issue-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false

      - name: Download passing patch, attempt 1
        if: needs.gate-1.outputs.result == 'pass'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attempt-1
          path: ${{ runner.temp }}/final

      - name: Download passing patch, attempt 2
        if: needs.gate-1.outputs.result != 'pass'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attempt-2
          path: ${{ runner.temp }}/final

      - name: Apply, check, push branch and open PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.factory_pat || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: factory/issue-${{ github.event.issue.number }}-${{ github.run_id }}
          BASE_SHA: ${{ needs.build.outputs.base }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PATCH: ${{ runner.temp }}/final/patch.diff
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: bash factory/scripts/open-pr.sh

  # One reporter for every run that did not open a PR, so a stopped run never goes silent.
  report:
    needs: [build, gate-1, build-2, gate-2, publish]
    if: ${{ always() && needs.build.result != 'skipped' && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment and label the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GATE_1: ${{ needs.gate-1.outputs.result }}
          GATE_2: ${{ needs.gate-2.outputs.result }}
        run: |
          gh label create needs-human --color D93F0B --description "Factory stopped; a person decides" --force
          gh issue comment "$ISSUE_NUMBER" --body "Factory stopped without a PR. Gate result: attempt 1 ${GATE_1:-not run}, attempt 2 ${GATE_2:-not run}. Check the run log for the step that stopped. Needs a human."
          gh issue edit "$ISSUE_NUMBER" --add-label needs-human

  # Finds the PR from the branch name, not from publish's outputs. Those did not reach this job
  # in the first live run. The bare `needs.publish.result == 'success'` also skipped this job in
  # live runs, while the same test with always() ran (probe runs, 2026-11-22). Keep the braces.
  review:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout factory branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: factory/issue-${{ github.event.issue.number }}-${{ github.run_id }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DustyStudy/issue-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Review diff and label PR
        env:
          FACTORY_DIR: ${{ github.workspace }}/factory
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVIEW_BUDGET: ${{ inputs.review_budget }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: factory/issue-${{ github.event.issue.number }}-${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bash factory/scripts/review.sh

      - name: Label PR for a human when review crashed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: factory/issue-${{ github.event.issue.number }}-${{ github.run_id }}
        run: gh pr edit "$(gh pr view "$BRANCH" --json number --jq .number)" --add-label needs-human
